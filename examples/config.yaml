# Optional gateway identifier (unique per user, not a Pi session name):
instanceName: research
# Prefer `pi-gateway init` to generate a unique instanceId automatically.
# If starting from this manual example, run `pi-gateway migrate-db -c <file>`
# before starting to assign an ID and select the shared database.
# Never copy an instanceId from another bot's config.
# databasePath: ~/.local/state/pi-gateway/gateway.sqlite3  # Optional override after migration
logLevel: INFO

telegram:
  # Prefer env var in production:
  botToken: env:TELEGRAM_BOT_TOKEN
  allowedUserIds:
    - 123456789
  allowGroups: false
  includeUserInGroupSessionKey: false

pi:
  command: pi
  # All Pi sessions will be created/resumed from this directory.
  cwd: ~/pi-workspace
  # Optional. Leave unset to use Pi's default ~/.pi/agent/sessions.
  # sessionDir: ~/.pi/agent/sessions
  # Optional Pi startup defaults (also set with init/configure flags):
  # defaultProvider: anthropic
  # defaultModel: claude-sonnet-4-5
  # defaultThinking: medium
  idleTtlSeconds: 1800
  # Maximum bytes for one stdout/stderr RPC frame from Pi. Can also be set
  # with PI_GATEWAY_RPC_STREAM_LIMIT.
  rpcStreamLimit: 16777216
  extraArgs: []
